name: execute
description: Execute a remote script
inputs:
  host:
    description: 'SSH hostname'
    required: true
  port:
    description: 'SSH port'
    required: true
    default: '22'
  user:
    description: 'SSH user'
    required: true
  target_path:
    description: 'path to run command from'
    required: true
  commands:
    description: 'commands to run'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      # Keep the connection alive while the remote command runs. Steps such as installing npm
      # dependencies or building assets can go minutes without writing any output, and the idle
      # connection gets dropped, failing the step with "Broken pipe" and exit code 255.
      run: ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ssh://${{ inputs.user }}@${{ inputs.host }}:${{ inputs.port }} "cd ${{ inputs.target_path }} && ${{ inputs.commands }}"
